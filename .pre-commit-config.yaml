#        args: [--line-length=90, --target-version=py37]
#        additional_dependencies:
#          - black

  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        name: autoflake
        entry: autoflake
        language: python
        types: [python]
        exclude: __init__.py
        args: [
          --in-place,
          --ignore-init-module-imports,
          --remove-all-unused-imports,
          --remove-duplicate-keys,
#          --ignore-pass-statements,
        ]
        additional_dependencies:
          - autoflake

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      # 1. ЛИНТЕР (Заменяет Flake8 и все 18 плагинов)
      - id: ruff
        name: ruff-linter
        exclude: ^(app|tests)
        args: [
          "--fix",  # Автоматически чинит безопасные ошибки кода и импортов
          "--line-length=110",  # Ваша максимальная длина строки
          "--target-version=py314", # Указываем вашу версию Python 3.14

          # Перечисляем наборы правил (аналоги ваших 18 плагинов)
          "--select=E,W,F,ANN,B,A,COM,C4,T10,ERA,EXE,FIX,PYI,S,ARG,TD,I",

          # Ваши старые правила игнорирования (переведенные на синтаксис Ruff)
          "--ignore=ANN101,ANN102,ANN401,B017,EXE002,S101,FIX002,TD002,TD003",

          # Настройка для папки tests (разрешаем assert в тестах)
          "--per-file-ignores=tests/*.py:S101",

          # Замена закомментированной строчки для FastAPI
#          "--extend-immutable-calls=fastapi.Depends,fastapi.params.Depends,Depends"
        ]

      - id: ruff-format
        name: ruff-formatter
#        exclude: ^tests
        args: [ "--line-length=110" ]

