  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
        name: yesqa
        entry: yesqa
        language: python
        types: [python]
        additional_dependencies:
          - yesqa
          - flake8
          - flake8-bandit
          - flake8-bugbear
          - flake8-eradicate
          - flake8-string-format
          - flake8-unused-arguments

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        language_version: python3.14
        types: [python]
        exclude: ^(migrations|alembic|tests|app)/
        # убрать при случае app, но сейчас там хлам ...
        args: [
          --show-error-codes,
          --python-version=3.14,
          "--exclude", "^(migrations|alembic|tests|app)/",
          "--ignore-missing-imports",
          "--explicit-package-bases"
        ]
        additional_dependencies:
          - lxml
#          - typed-ast

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        args: ["-q", "-m", "not slow"]
        entry: pytest
        language: python
        language_version: python3.14
        pass_filenames: false
        always_run: true
        additional_dependencies:
          - lxml

exclude: |
    (?x)(
        __pycache__
        ^alembic/|
        ^samples/|
        ^docs/|
        ^.venv/|
        ^.idea/
    )
