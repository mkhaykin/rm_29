repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # 3.7
    hooks:
      - id: trailing-whitespace      # убирает лишние пробелы
        files: \.(py|sh|rst|yml|yaml)$
      - id: check-added-large-files  # тяжелые файлы
        args: ['--maxkb=10']
        exclude: ^zabbix_template/
      - id: check-yaml               # синтаксис .yaml файлов
      - id: check-json               # синтаксис .json файлов
      - id: check-case-conflict   # проверяет файлы, которые могут конфликтовать в файловых системах без учета регистра.
      - id: check-merge-conflict  # проверяет файлы, содержащие конфликтные строки слияния.
      - id: end-of-file-fixer          # добавляет пустую строку в конце файла
      - id: debug-statements

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.0b2
    hooks:
      - id: isort
        name: isort
        entry: isort
        language: python
        types: [python]
        exclude: __init__.py
        args: [ --profile, black, --line-length=79, ]
        additional_dependencies:
          - isort

#  - repo: https://github.com/psf/black
#    rev: 26.5.1
#    hooks:
#      - id: black
#        name: black
#        entry: black
#        language: python
